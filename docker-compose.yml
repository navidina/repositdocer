version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rayan-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: codewiki
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  backend:
    build: ./server
    container_name: rayan-backend
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: codewiki
      OLLAMA_HOST: http://host.docker.internal:11434 # Change this if Ollama is on another server
      INTEGRATION_API_KEY: "change_me_in_prod"
    ports:
      - "3000:3000"
    depends_on:
      - db
    restart: always

  frontend:
    build: .
    container_name: rayan-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
