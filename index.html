    <style>
      body {
        font-family: 'Vazirmatn', sans-serif;
        background-color: #F8FAFC; 
      }
      
      /* Modern Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.02);

      /* New File Header Styling */
      .file-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        direction: ltr; 
        width: 100%;
        padding: 1rem;
        box-sizing: border-box;
        background: linear-gradient(to right, #f8fafc, #fff);
        border-radius: 12px;
        border: 1px solid #f1f5f9;
        margin-bottom: 1rem;
      }
      .file-info-group {
        display: flex;
        align-items: center;
        gap: 12px;
        overflow: hidden;
      }
      .file-icon {
        flex-shrink: 0;
        background: #fff;
        color: #7c3aed;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        font-size: 16px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);

        font-family: monospace;
        flex-shrink: 0;
        background: #f1f5f9;
        padding: 4px 10px;
        border-radius: 20px;
        font-weight: 600;
      }

      /* Markdown Content Enhancements */
      .prose h1, .prose h2, .prose h3 {
        color: #1e293b;
      }
      .prose blockquote {
        border-right: 4px solid #8b5cf6;
        background: #f5f3ff;
        padding: 1rem;
        border-radius: 8px;
        font-style: normal;
        color: #5b21b6;
      }
      .prose table {
        border-radius: 8px;
        overflow: hidden;
        border-collapse: separate;
        border-spacing: 0;
        border: 1px solid #e2e8f0;
        width: 100%;
      }
      .prose th {
        background: #f8fafc;
        padding: 12px;
        text-align: right;
        font-size: 0.9em;
      }
      .prose td {
        padding: 12px;
        border-top: 1px solid #e2e8f0;
        font-size: 0.9em;
      }
